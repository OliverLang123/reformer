<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Sumář tréninku - Ember</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  /* ===== Design tokens (Volt / Ember). Same values as tokens.json ===== */
  :root {
    --bg: #0B0C0E;
    --tile: #16181C;
    --tile-border: #23262C;
    --text: #F3F4F6;
    --text-muted: #8A9099;
    --text-soft: #C9CDD3;
    --chip-neutral: #23262C;
    --ink-on-accent: #0B0C0E;

    --accent: #FF6A2B;            /* overridden from data.theme.accent */
    --accent-chip: #37231E;       /* mix(accent, tile, 14 %) - computed in JS */
    --muscle-primary: #FF6A2B;    /* = accent */
    --muscle-secondary: #A24925;  /* mix(accent, tile, 60 %) */
    --muscle-tertiary: #5C3121;   /* mix(accent, tile, 30 %) */
    --muscle-inactive: #2B2E35;
    --muscle-inactive-alt: #272A30;
    --muscle-head: #383C45;

    --radius: 28px;
    --gap: 16px;
    --pad: 48px;

    --font-display: 'Unbounded', sans-serif;
    --font-text: 'Inter Tight', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  html, body { margin: 0; background: var(--bg); }

  /* ===== Canvas 1080 x 1080 ===== */
  .card {
    width: 1080px; height: 1080px; box-sizing: border-box; padding: var(--pad);
    background: var(--bg); color: var(--text); font-family: var(--font-text);
    display: flex; flex-direction: column; gap: var(--gap); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .mono-label {
    font-family: var(--font-mono); font-size: 13px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);
  }

  /* Header */
  .header { display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; }
  .header__top { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px 0 12px;
    border-radius: 999px; background: var(--accent); color: var(--ink-on-accent);
    font-family: var(--font-mono); font-weight: 700; font-size: 14px; letter-spacing: 0.08em;
    text-transform: uppercase; white-space: nowrap;
  }
  .date {
    font-family: var(--font-mono); font-size: 15px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-muted); white-space: nowrap;
  }
  .title {
    margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 68px; line-height: 1;
    letter-spacing: -0.02em; white-space: nowrap; overflow: hidden;
  }
  .title .plus { color: var(--accent); }

  /* Tiles */
  .tile {
    box-sizing: border-box; border-radius: var(--radius);
    background: var(--tile); border: 1px solid var(--tile-border);
  }
  .row-main { display: flex; gap: var(--gap); height: 608px; }
  .row-stats { flex: 1; min-height: 0; display: flex; gap: var(--gap); }

  /* Muscle map tile */
  .tile-body { width: 480px; flex: none; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .figures { display: flex; justify-content: center; gap: 4px; margin: 0 -12px; }
  .figure { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .figure svg { display: block; width: 226px; height: 449px; }
  .figure .mono-label { font-size: 12px; }
  .legend {
    margin-top: auto; display: flex; justify-content: center; gap: 20px;
    font-size: 14px; font-weight: 500; color: var(--text-soft);
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 10px; height: 10px; border-radius: 999px; display: block; }

  /* Exercises tile */
  .tile-exercises { flex: 1; min-width: 0; padding: 26px 28px 14px; display: flex; flex-direction: column; }
  .tile-exercises__head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; }
  .ex-list { flex: 1; display: flex; flex-direction: column; }
  .ex { flex: 1; display: flex; align-items: center; gap: 16px; min-height: 0; }
  .ex + .ex { border-top: 1px solid var(--tile-border); }
  .ex__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .ex__equip {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .ex__name-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ex__name {
    font-size: 23px; font-weight: 600; line-height: 1.15; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .badge-max {
    flex: none; height: 22px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 6px;
    background: var(--accent); color: var(--ink-on-accent);
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  }
  .ex__sets { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; white-space: nowrap; min-width: 0; }
  .ex__top { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--text); }
  .ex__prev { font-size: 15px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; }

  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px;
    border-radius: 999px; font-family: var(--font-mono); font-size: 14px; font-weight: 700; white-space: nowrap;
    background: var(--chip-neutral); color: var(--text-soft);
  }
  .chip--up { background: var(--accent-chip); color: var(--accent); }
  .chip svg { width: 16px; height: 16px; }

  /* Stat tiles */
  .tile-volume { width: 404px; flex: none; padding: 26px 28px; display: flex; flex-direction: column; justify-content: space-between; }
  .tile-sets { width: 200px; flex: none; padding: 26px 24px; display: flex; flex-direction: column; justify-content: space-between; }
  .stat-head { display: flex; justify-content: space-between; align-items: center; height: 24px; }
  .stat-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .stat-value-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .stat-value {
    font-family: var(--font-display); font-size: 76px; font-weight: 700; line-height: 0.95;
    letter-spacing: -0.03em; color: var(--text); white-space: nowrap;
  }
  .stat-unit { font-family: var(--font-display); font-size: 26px; font-weight: 600; color: var(--text-muted); }
  .stat-note { font-size: 15px; font-weight: 500; color: var(--text-muted); white-space: nowrap; }

  /* Highlight tile: personal record (accent) or fallback (neutral) */
  .tile-pr {
    flex: 1; min-width: 0; padding: 26px 28px; display: flex; flex-direction: column; justify-content: space-between;
    background: var(--accent); border-color: var(--accent); color: var(--ink-on-accent);
  }
  .tile-pr__head { display: flex; align-items: center; gap: 10px; height: 24px; }
  .tile-pr__label { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .tile-pr__body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tile-pr__name { font-size: 24px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-pr__value { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; white-space: nowrap; }
  .tile-pr__note { font-size: 15px; font-weight: 600; opacity: 0.75; white-space: nowrap; }
  .tile-pr--neutral { background: var(--tile); border-color: var(--tile-border); color: var(--text); }
  .tile-pr--neutral .tile-pr__head { color: var(--accent); }
  .tile-pr--neutral .tile-pr__note { opacity: 1; color: var(--text-muted); }
</style>
</head>

        <span><i style="background: var(--muscle-primary)"></i>Hlavní</span>
        <span><i style="background: var(--muscle-secondary)"></i>Vedlejší</span>
        <span><i style="background: var(--muscle-tertiary)"></i>Doplňkové</span>
      </div>
    </section>

    <section class="tile tile-exercises">
      <div class="tile-exercises__head mono-label">
        <span data-bind="exHead">Hlavní cviky</span>
        <span data-bind="exHeadRight">vs. minule</span>
      </div>
      <div class="ex-list" id="ex-list"></div>
    </section>
  </div>

  <div class="row-stats">
    <section class="tile tile-volume">
      <div class="stat-head">
        <span class="mono-label" data-bind="volumeLabel">Celkem zvednuto</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A9099" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 8h9l3 12h-15z"/><circle cx="12" cy="5" r="2.2"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-value-row">
          <span class="stat-value" data-bind="volume" data-fit></span>
          <span class="stat-unit" data-bind="volumeUnit">kg</span>
        </div>
        <span class="stat-note" data-bind="volumeNote"></span>
      </div>
    </section>

    <section class="tile tile-sets">
      <div class="stat-head"><span class="mono-label">Série</span></div>
      <div class="stat-body">
        <span class="stat-value" data-bind="sets" data-fit></span>
        <span class="stat-note" data-bind="setsNote"></span>
      </div>
    </section>

    <section class="tile tile-pr" id="tile-pr">
      <div class="tile-pr__head">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5v1.5A3.5 3.5 0 0 0 8 11M17 6h2.5v1.5A3.5 3.5 0 0 1 16 11"/></svg>
        <span class="tile-pr__label" data-bind="prLabel"></span>
      </div>
      <div class="tile-pr__body">
        <span class="tile-pr__name" data-bind="prName"></span>
        <span class="tile-pr__value" data-bind="prValue" data-fit></span>
        <span class="tile-pr__note" data-bind="prNote"></span>
      </div>
    </section>
  </div>
</div>

<!-- Sample data. In the app, call window.renderSummary(data) instead (see HANDOFF.md). -->
<script type="application/json" id="sample-data">
{
  "label": "Silový trénink A",
  "title": "Nohy + core",
  "date": "2026-11-09",
  "totalVolumeKg": 9870,
  "workingSets": 24,
  "theme": { "accent": "#FF6A2B" },
  "exercises": [
    { "name": "Squat", "equipment": "Barbell", "top": { "weightKg": 100, "reps": 10 }, "previous": { "weightKg": 100, "reps": 10 } },
    { "name": "Romanian Deadlift", "equipment": "Barbell", "top": { "weightKg": 50, "reps": 10 }, "previous": { "weightKg": 30, "reps": 10 }, "isPR": true },
    { "name": "Bulgarian Split Squat", "equipment": "Dumbbell", "top": { "weightKg": 40, "reps": 10 }, "previous": { "weightKg": 40, "reps": 8 } },
    { "name": "Hip Thrust", "equipment": "Barbell", "top": { "weightKg": 70, "reps": 10 }, "previous": { "weightKg": 50, "reps": 9 } }
  ]
}
</script>

<script>
(function () {
  'use strict';

  var MAX_EXERCISES = 4;
  var CAR_KG = 1500; // "≈ N osobního auta" - average passenger car

  // ---------- helpers ----------
  function hexToRgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }); }
  function mix(a, b, t) {
    var pa = hexToRgb(a), pb = hexToRgb(b);
    return '#' + pa.map(function (v, k) {
      var c = Math.round(v * t + pb[k] * (1 - t));
      return (c < 16 ? '0' : '') + c.toString(16);
    }).join('').toUpperCase();
  }
  var nf0 = new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 0 });
  var nf1 = new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 1 });
  var nfKg = new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 2 });

  // Czech plural: 1 / 2-4 / 5+ ; decimals take genitive singular ("6,6 osobního auta")
  function plural(n, one, few, many, frac) {
    if (Math.round(n) !== n) return frac;
    if (n === 1) return one;
    if (n >= 2 && n <= 4) return few;
    return many;
  }
  function kg(w) { return nfKg.format(w); }
  function setText(w, r) { return kg(w) + ' kg × ' + r; }
  // Reformer: cviky s vlastní vahou (bodyweight: true) mají ve weightKg přidanou zátěž
  function exSet(ex, s) {
    if (!ex.bodyweight) return setText(s.weightKg, s.reps);
    return s.weightKg > 0 ? '+' + setText(s.weightKg, s.reps) : 'vlastní váha × ' + s.reps;
  }
  function exPrev(ex, s) {
    if (!ex.bodyweight) return kg(s.weightKg) + ' × ' + s.reps;
    return s.weightKg > 0 ? '+' + kg(s.weightKg) + ' × ' + s.reps : String(s.reps);
  }

  // Reformer: svalová mapa z dat. data.body = { front: { viewBox, parts: [{ d, tone }] }, back: ... },
  // tone je primary, secondary, tertiary, inactive, inactive-alt nebo head. Bez data.body zůstane
  // ukázková mapa ze šablony. viewBox se po vykreslení zúží na obrys postavy.
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function drawBody(body) {
    var svgs = document.querySelectorAll('.figure svg');
    ['front', 'back'].forEach(function (side, i) {
      var fig = body[side];
      var svg = svgs[i];
      if (!fig || !svg) return;
      svg.textContent = '';
      svg.setAttribute('viewBox', fig.viewBox);
      fig.parts.forEach(function (part) {
        var path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('class', 'muscle muscle--' + part.tone);
        path.setAttribute('style', 'fill: var(--muscle-' + part.tone + ')');
        path.setAttribute('d', part.d);
        svg.appendChild(path);
      });
      var b = svg.getBBox();
      if (b.width && b.height) svg.setAttribute('viewBox', [b.x, b.y, b.width, b.height].join(' '));
    });
  }
  function parseDate(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }

  var ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>';
  var ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5.5 12.5L12 19l6.5-6.5"/></svg>';
  var ICON_SAME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>';
  var ICON_NEW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

  // Delta vs. previous session: weight first, then reps.
  function delta(ex) {
    var t = ex.top, p = ex.previous;
    if (!p) return { kind: 'new', text: 'nový', icon: ICON_NEW };
    var dw = Math.round((t.weightKg - p.weightKg) * 100) / 100;
    if (dw > 0) return { kind: 'up', text: '+' + kg(dw) + ' kg', icon: ICON_UP };
    if (dw < 0) return { kind: 'down', text: '-' + kg(-dw) + ' kg', icon: ICON_DOWN };
    var dr = t.reps - p.reps;
    if (dr > 0) return { kind: 'up', text: '+' + dr + ' opak.', icon: ICON_UP };
    if (dr < 0) return { kind: 'down', text: '-' + (-dr) + ' opak.', icon: ICON_DOWN };
    return { kind: 'same', text: 'stejně', icon: ICON_SAME };
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function bind(name, value) {
    document.querySelectorAll('[data-bind="' + name + '"]').forEach(function (n) { n.textContent = value; });
  }

  // Shrink text until it fits its box (long names, 6-digit volumes).
  function fit(node, minPx) {
    var size = parseFloat(getComputedStyle(node).fontSize);
    var box = node.parentElement;
    var guard = 60;
    while (guard-- > 0 && size > minPx && (node.scrollWidth > node.clientWidth + 0.5 || box.scrollWidth > box.clientWidth + 0.5)) {
      size -= 2;
      node.style.fontSize = size + 'px';
    }
  }

  // ---------- render ----------
  function renderSummary(data) {
    var root = document.documentElement;
    var accent = (data.theme && /^#[0-9a-fA-F]{6}$/.test(data.theme.accent)) ? data.theme.accent.toUpperCase() : '#FF6A2B';
    var tile = '#16181C';
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-chip', mix(accent, tile, 0.14));
    root.style.setProperty('--muscle-primary', accent);
    root.style.setProperty('--muscle-secondary', mix(accent, tile, 0.6));
    root.style.setProperty('--muscle-tertiary', mix(accent, tile, 0.3));

    if (data.body) drawBody(data.body);

    // header
    bind('label', data.label || 'Silový trénink');
    var d = parseDate(data.date);
    var weekday = new Intl.DateTimeFormat('cs-CZ', { weekday: 'long' }).format(d);
    var day = new Intl.DateTimeFormat('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric' }).format(d);
    bind('date', weekday + ' ' + day);

    var title = document.querySelector('[data-bind="title"]');
    title.textContent = '';
    String(data.title || '').split('+').forEach(function (part, i) {
      if (i > 0) title.appendChild(el('span', 'plus', '+'));
      title.appendChild(document.createTextNode(part));
    });

    // exercises
    var list = document.getElementById('ex-list');
    list.textContent = '';
    var exercises = (data.exercises || []).slice(0, MAX_EXERCISES);
    exercises.forEach(function (ex) {
      var row = el('div', 'ex');
      var main = el('div', 'ex__main');
      main.appendChild(el('span', 'ex__equip', ex.equipment || ''));
      var nameRow = el('span', 'ex__name-row');
      nameRow.appendChild(el('span', 'ex__name', ex.name));
      if (ex.isPR) nameRow.appendChild(el('span', 'badge-max', 'MAX'));
      main.appendChild(nameRow);
      var sets = el('span', 'ex__sets');
      // Reformer: cvik na čas nebo vzdálenost (timed: true) má hotový text ("0:34 / 0:31", "2 km 9:12")
      // a s minulým tréninkem se neporovnává
      if (ex.timed) {
        sets.appendChild(el('span', 'ex__top', ex.text || ''));
        main.appendChild(sets);
        row.appendChild(main);
        list.appendChild(row);
        return;
      }
      sets.appendChild(el('span', 'ex__top', exSet(ex, ex.top)));
      if (ex.previous) sets.appendChild(el('span', 'ex__prev', 'minule ' + exPrev(ex, ex.previous)));
      main.appendChild(sets);
      row.appendChild(main);

      var dl = delta(ex);
      var chip = el('span', 'chip' + (dl.kind === 'up' ? ' chip--up' : ''));
      chip.innerHTML = dl.icon; // static icon markup only
      chip.appendChild(document.createTextNode(dl.text));
      row.appendChild(chip);
      list.appendChild(row);
    });

    // Reformer: trénink bez vah (data.timed = { sets, duration }): místo objemu počet všech sérií,
    // místo nejtěžší série délka tréninku
    var timed = data.timed || null;
    bind('exHead', timed ? 'Cviky na čas' : 'Hlavní cviky');
    bind('exHeadRight', timed ? '' : 'vs. minule');

    // volume
    var vol = data.totalVolumeKg || 0;
    bind('volumeLabel', timed ? 'Sérií celkem' : 'Celkem zvednuto');
    bind('volumeUnit', timed ? '' : 'kg');
    bind('volume', timed ? String(timed.sets || 0) : nf0.format(vol));
    var cars = Math.round((vol / CAR_KG) * 10) / 10;
    bind('volumeNote', timed ? 'včetně rozcviček' : cars > 0 ? '≈ ' + nf1.format(cars) + ' ' + plural(cars, 'osobní auto', 'osobní auta', 'osobních aut', 'osobního auta') : '');

    // sets
    var n = data.workingSets || 0;
    bind('sets', String(n));
    bind('setsNote', plural(n, 'pracovní série', 'pracovní série', 'pracovních sérií', 'pracovních sérií'));

    // highlight tile: PR if any, else heaviest top set
    var all = data.exercises || [];
    var pr = data.personalRecord || all.filter(function (e) { return e.isPR; })[0];
    var tilePr = document.getElementById('tile-pr');
    if (timed) {
      tilePr.classList.add('tile-pr--neutral');
      bind('prLabel', 'Délka tréninku');
      bind('prName', '');
      bind('prValue', timed.duration || '');
      bind('prNote', timed.duration ? 'od začátku do uložení' : '');
    } else if (pr) {
      tilePr.classList.remove('tile-pr--neutral');
      bind('prLabel', 'Nové maximum');
      bind('prName', pr.name);
      bind('prValue', exSet(pr, pr.top));
      var dl2 = delta(pr);
      bind('prNote', dl2.kind === 'new' ? 'první záznam' : (dl2.kind === 'up' ? dl2.text + ' oproti minule' : 'osobní rekord'));
    } else {
      var heavy = all.filter(function (e) { return e.top; }).sort(function (a, b) { return b.top.weightKg - a.top.weightKg; })[0];
      tilePr.classList.add('tile-pr--neutral');
      bind('prLabel', 'Nejtěžší série');
      bind('prName', heavy ? heavy.name : '');
      bind('prValue', heavy ? exSet(heavy, heavy.top) : '');
      bind('prNote', 'dnešní top set');
    }

    // fit long values after fonts are ready
    return document.fonts.ready.then(function () {
      title.style.fontSize = '';
      document.querySelectorAll('[data-fit]').forEach(function (n) { n.style.fontSize = ''; });
      fit(title, 40);
      document.querySelectorAll('[data-fit]').forEach(function (n) { fit(n, 24); });
      document.body.setAttribute('data-ready', 'true');
    });
  }

  window.renderSummary = renderSummary;

  // Standalone preview: ?data=<url-encoded JSON> or the embedded sample.
  var q = new URLSearchParams(location.search).get('data');
  var sample = JSON.parse(document.getElementById('sample-data').textContent);
  renderSummary(q ? JSON.parse(q) : sample);
})();
</script>
</body>
</html>
